# Cada vez que cambia una publicación, una cuenta o la plantilla, GitHub:
# 1. ordena las cuentas (renombra fotos de perfil y actualiza la lista), y
# 2. genera las imágenes en salida/. Gratis, sin usar tu PC.
name: Generar láminas

on:
  push:
    paths:
      - "publicaciones/**/*.txt"
      - "plantilla/**"
      - "cuentas/**"
      - "scripts/**"
      - "generar.py"
      - ".github/workflows/generar.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # para saber la fecha de cada publicación

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install playwright pillow
          python -m playwright install --with-deps chromium

      - name: Ordenar cuentas
        run: python scripts/ordenar_cuentas.py

      - name: Generar las láminas
        run: python generar.py

      - name: Armar el historial
        run: python scripts/indice.py

      - name: Guardar los cambios en el repositorio
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add cuentas salida
          git diff --cached --quiet || git commit -m "Cuentas ordenadas y láminas generadas"
          git pull --rebase -q
          git push
