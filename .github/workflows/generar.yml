# Cada vez que subes o cambias un .txt en publicaciones/, GitHub genera las
# imágenes en sus propios servidores y las guarda en salida/. Gratis, sin PC.
name: Generar láminas

on:
  push:
    paths:
      - "publicaciones/**/*.txt"
      - "plantilla/**"
      - "cuentas/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Playwright y Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Generar las láminas
        run: python generar.py

      - name: Guardar las imágenes en el repositorio
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add salida
          git diff --cached --quiet || git commit -m "Láminas generadas"
          git push
