<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Creador de publicaciones</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='3' width='20' height='26' rx='2' fill='%23e9dcc3' stroke='%232a1d14' stroke-width='2'/%3E%3Cpath d='M10 12h12M10 17h9' stroke='%238c2f1f' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <script>
    // GitHub Pages deja copias guardadas en el navegador. Con esto siempre se carga
    // la última versión del editor y de la plantilla apenas se publica un cambio.
    window.VERSION = Date.now();
    document.write(`<link rel="stylesheet" href="editor/editor.css?v=${VERSION}">`);
  </script>
</head>
<body>
  <header class="banda" id="banda">
    <div class="banda-dentro">
      <div class="identidad">
        <div class="foto-grande" id="fotoGrande"></div>
        <div>
          <p class="red" id="redCuenta"></p>
          <h1 id="nombreCuenta">Creador de publicaciones</h1>
        </div>
      </div>
      <div class="cuentas" id="cuentas" role="radiogroup" aria-label="Cuenta"></div>
    </div>
  </header>

  <main class="mesa">
    <section class="escritorio">
      <div class="final">
        <span>Lámina final</span>
        <div class="final-opciones" id="finalOpciones" role="radiogroup" aria-label="Lámina final"></div>
      </div>

      <label class="campo-nombre">
        <span>Nombre</span>
        <input id="nombre" type="text" value="nueva-publicacion" spellcheck="false" autocomplete="off">
      </label>

      <div class="hoja">
        <textarea id="texto" spellcheck="true" aria-label="Texto de la publicación"></textarea>
      </div>

      <section class="piezas" aria-labelledby="tituloPiezas">
        <h2 id="tituloPiezas">Códigos <small>toca uno para insertarlo donde está el cursor</small></h2>
        <div class="piezas-grupo" id="piezasLaminas"></div>
        <h3>Ajustes <small>van antes de la primera lámina</small></h3>
        <div class="piezas-grupo" id="piezasAjustes"></div>
      </section>
    </section>

    <section class="vista">
      <div class="carrete" id="carrete" aria-live="polite"></div>
      <p class="contador" id="contador"></p>
      <div class="acciones">
        <button class="principal" id="guardar">Guardar imágenes</button>
        <button id="github">Subir al repositorio</button>
      </div>
      <p class="estado" id="estado" role="status"></p>
    </section>
  </main>

  <dialog id="dialogoCuenta" class="dialogo">
    <form method="dialog" id="formCuenta">
      <header>
        <h2>Nueva cuenta</h2>
        <button type="button" class="cerrar" id="cerrarCuenta" aria-label="Cerrar">×</button>
      </header>
      <div class="dialogo-cuerpo">
        <div class="dialogo-campos">
          <label>Usuario <input name="usuario" required placeholder="mi.cuenta" autocomplete="off" spellcheck="false"></label>
          <label>Red
            <select name="red"><option value="instagram">Instagram</option><option value="tiktok">TikTok</option></select>
          </label>
          <label class="ancho">Nombre en dos colores <input name="nombre" placeholder="mi|cuenta" autocomplete="off" spellcheck="false">
            <small>Separa con | dónde cambia el color.</small></label>
          <label class="ancho">Frase final <input name="llamado" value="like, comenta, comparte y guarda"></label>
          <label>Color principal <input type="color" name="acento" value="#e2671f"></label>
          <label>Color secundario <input type="color" name="acento2" value="#3d5a6b"></label>
          <label>Fondo
            <select name="fondo">
              <option value="papel">Papel antiguo</option>
              <option value="claro">Claro</option>
              <option value="oscuro">Oscuro</option>
            </select>
          </label>
          <label>Letra
            <select name="letra">
              <option value="clasica">Clásica (Lora)</option>
              <option value="escolar">Condensada (Fjalla + Nunito)</option>
              <option value="moderna">Moderna (Inter)</option>
            </select>
          </label>
          <label class="ancho">Foto de perfil <input type="file" name="foto" accept="image/*"></label>
        </div>
        <div class="dialogo-vista"><div class="marco-prev" id="vistaCuenta"></div></div>
      </div>
      <footer>
        <p class="nota">Se guarda en este navegador para usarla ya. Para que quede en el repositorio, descarga la carpeta y súbela a <code>cuentas/</code> en GitHub.</p>
        <div class="acciones">
          <button type="button" id="descargarCuenta">Descargar carpeta</button>
          <button type="submit" class="principal" id="guardarCuenta">Guardar cuenta</button>
        </div>
      </footer>
    </form>
  </dialog>

  <script src="vendor/jszip.min.js"></script>
  <script>document.write(`<script src="editor/editor.js?v=${VERSION}"><\/script>`);</script>
</body>
</html>
